<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eu sarapinto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --black: #111; --white: #fff; --gray: #e8e8e4; --light-gray: #f4f4f2; --mid-gray: #999; --gap: 12px; }
    html { font-size: 16px; }
    body { font-family: 'DM Sans', sans-serif; font-weight: 300; background: var(--white); color: var(--black); min-height: 100vh; display: flex; flex-direction: column; }

    header { display: flex; align-items: center; justify-content: space-between; padding: 28px 150px; position: sticky; top: 0; background: var(--white); z-index: 100; border-bottom: 1px solid transparent; transition: border-color 0.3s; }
    header.scrolled { border-color: var(--gray); }
    @media (max-width: 1100px) { header { padding: 24px 40px; } }
    @media (max-width: 600px) { header { padding: 20px; } }

    .logo { text-decoration: none; display: flex; align-items: center; }
    .logo-img { height: 28px; width: auto; display: block; }
    @media (max-width: 600px) { .logo-img { height: 22px; } }

    nav a { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: #c0392b; text-decoration: none; transition: color 0.2s; }
    nav a:hover { color: var(--black); }

    main { flex: 1; }
    .grid-wrapper { padding: 40px 150px; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--gap); }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } .grid-wrapper { padding: 20px 40px; } }
    @media (max-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 1px; } .grid-wrapper { padding: 0; } }

    .tile { position: relative; cursor: pointer; overflow: hidden; background: var(--light-gray); }
    .tile-inner { position: relative; width: 100%; padding-top: 100%; }
    .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.4s ease; }
    .tile img.loaded { opacity: 1; }
    .tile-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0); display: flex; align-items: flex-end; padding: 16px; transition: background 0.3s; pointer-events: none; }
    .tile-title { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 0.85rem; color: white; opacity: 0; transform: translateY(6px); transition: opacity 0.25s, transform 0.25s; line-height: 1.3; }
    @media (hover: hover) {
      .tile:hover img { transform: scale(1.04); }
      .tile:hover .tile-overlay { background: rgba(0,0,0,0.18); }
      .tile:hover .tile-title { opacity: 1; transform: translateY(0); }
    }
    .tile-placeholder { position: absolute; inset: 0; background: var(--light-gray); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: var(--mid-gray); letter-spacing: 0.05em; }
    .tile.active img { opacity: 0.7; }

    /* LIGHTBOX */
    .lightbox { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(255,255,255,0.97); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: lbIn 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    .lightbox.open { display: flex; flex-direction: column; }
    @keyframes lbIn { from { opacity: 0; } to { opacity: 1; } }

    .lb-bar { display: flex; align-items: center; justify-content: space-between; padding: 20px 28px; border-bottom: 1px solid var(--gray); flex-shrink: 0; }
    .lb-title { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1rem; color: var(--black); }
    .lb-close { width: 32px; height: 32px; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--mid-gray); transition: color 0.2s; padding: 0; }
    .lb-close:hover { color: var(--black); }
    .lb-close svg { width: 20px; height: 20px; }

    .lb-content { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 32px 80px; }
    .lb-images { display: flex; gap: 8px; align-items: center; justify-content: center; max-height: 100%; width: 100%; }
    .lb-images img { flex: 1; min-width: 0; max-height: calc(100vh - 160px); width: auto; height: auto; object-fit: contain; display: block; }

    .lb-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; background: var(--white); border: 1px solid var(--gray); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--black); transition: background 0.2s, border-color 0.2s; z-index: 10; }
    .lb-arrow:hover { background: var(--light-gray); border-color: var(--black); }
    .lb-arrow:disabled { opacity: 0.2; cursor: default; pointer-events: none; }
    .lb-arrow svg { width: 16px; height: 16px; }
    .lb-arrow.prev { left: 20px; }
    .lb-arrow.next { right: 20px; }

    .lb-dots { display: none; align-items: center; justify-content: center; gap: 6px; padding: 14px 0; flex-shrink: 0; }
    .lb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gray); transition: background 0.2s; }
    .lb-dot.active { background: var(--black); }

    @media (max-width: 600px) {
      .lightbox.open { display: block; overflow-y: auto; background: var(--white); }
      .lb-bar { position: sticky; top: 0; background: var(--white); z-index: 10; padding: 16px 20px; }
      .lb-content { padding: 0; display: block; position: relative; overflow: visible; }
      .lb-images { display: block; width: 100%; overflow: hidden; position: relative; }
      .lb-images img { display: none; width: 100%; height: auto; max-height: none; flex: none; }
      .lb-images img.mobile-active { display: block; }
      .lb-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; background: rgba(255,255,255,0.85); border: none; z-index: 5; display: flex; }
      .lb-arrow.prev { left: 12px; }
      .lb-arrow.next { right: 12px; }
      .lb-arrow:disabled { opacity: 0; pointer-events: none; }
      .lb-dots { display: flex; }
      .lb-more { border-top: 1px solid var(--gray); padding: 20px 0 0; }
      .lb-more-label { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid-gray); margin-bottom: 10px; padding: 0 20px; }
      .lb-more-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; }
      .lb-more-tile { aspect-ratio: 1; overflow: hidden; cursor: pointer; background: var(--light-gray); }
      .lb-more-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    }

    @media (min-width: 601px) { .lb-more { display: none; } }

    footer { padding: 48px 150px; border-top: 1px solid var(--gray); display: flex; align-items: center; justify-content: space-between; }
    @media (max-width: 1100px) { footer { padding: 40px; } }
    @media (max-width: 600px) { footer { flex-direction: column; gap: 16px; padding: 32px 20px; text-align: center; } }
    .footer-name { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 0.95rem; color: var(--mid-gray); }
    .footer-links a { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid-gray); text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: var(--black); }
    .loading { grid-column: 1 / -1; text-align: center; padding: 80px; font-size: 0.8rem; color: var(--mid-gray); letter-spacing: 0.05em; }
  </style>
</head>
<body>

  <header id="header">
    <a href="/" class="logo">
      <img src="eusarapintologo.svg" alt="eu sarapinto" class="logo-img">
    </a>
    <nav>
      <a href="https://instagram.com/eusarapinto" target="_blank" rel="noopener">Instagram</a>
    </nav>
  </header>

  <div class="lightbox" id="lightbox">
    <div class="lb-bar">
      <span class="lb-title" id="lb-title"></span>
      <button class="lb-close" id="lb-close" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="lb-content" id="lb-content">
      <button class="lb-arrow prev" id="lb-prev">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="lb-images" id="lb-images"></div>
      <button class="lb-arrow next" id="lb-next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="lb-dots" id="lb-dots"></div>
    <div class="lb-more" id="lb-more">
      <div class="lb-more-label">Mais comics</div>
      <div class="lb-more-grid" id="lb-more-grid"></div>
    </div>
  </div>

  <main>
    <div class="grid-wrapper">
      <div class="grid" id="grid">
        <div class="loading">a carregar...</div>
      </div>
    </div>
  </main>

  <footer>
    <span class="footer-name">eu sarapinto</span>
    <div class="footer-links">
      <a href="https://instagram.com/eusarapinto" target="_blank" rel="noopener">Instagram</a>
    </div>
  </footer>

  <script>
    let comics = [];
    let activeIndex = null;
    let mobilePanelIndex = 0;

    window.addEventListener('scroll', () => {
      document.getElementById('header').classList.toggle('scrolled', window.scrollY > 10);
    });

    async function loadComics() {
      try {
        const res = await fetch('comics.json');
        comics = await res.json();
        renderGrid();
      } catch (e) {
        document.getElementById('grid').innerHTML = '<div class="loading">erro a carregar os comics.</div>';
      }
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          const src = img.dataset.src;
          if (src) {
            img.src = src;
            img.removeAttribute('data-src');
            img.onload = () => {
              img.classList.add('loaded');
              if (img.previousElementSibling) img.previousElementSibling.style.display = 'none';
            };
            img.onerror = () => { img.style.display = 'none'; };
          }
          observer.unobserve(img);
        }
      });
    }, { rootMargin: '200px' });

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      comics.forEach((comic, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.index = i;
        tile.innerHTML = `
          <div class="tile-inner">
            <div class="tile-placeholder">✦</div>
            <img data-src="${comic.cover}" alt="${comic.title}">
            <div class="tile-overlay"><span class="tile-title">${comic.title}</span></div>
          </div>`;
        tile.addEventListener('click', () => openLightbox(i));
        grid.appendChild(tile);
        observer.observe(tile.querySelector('img'));
      });
    }

    function updateMobileCarousel(images) {
      document.querySelectorAll('#lb-images img').forEach((img, i) => {
        img.classList.toggle('mobile-active', i === mobilePanelIndex);
      });
      document.querySelectorAll('.lb-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === mobilePanelIndex);
      });
      document.getElementById('lb-prev').disabled = mobilePanelIndex === 0;
      document.getElementById('lb-next').disabled = mobilePanelIndex === images.length - 1;
    }

    function openLightbox(index) {
      activeIndex = index;
      mobilePanelIndex = 0;
      const comic = comics[index];
      const isMobile = window.innerWidth <= 600;

      document.getElementById('lb-title').textContent = comic.title;

      document.getElementById('lb-images').innerHTML = comic.images
        .map((src, i) => `<img src="${src}" alt="${comic.title}" onerror="this.style.display='none'"${i === 0 ? ' class="mobile-active"' : ''}>`)
        .join('');

      document.getElementById('lb-dots').innerHTML = comic.images.length > 1
        ? comic.images.map((_, i) => `<div class="lb-dot${i === 0 ? ' active' : ''}"></div>`).join('')
        : '';

      if (isMobile) {
        document.getElementById('lb-prev').disabled = true;
        document.getElementById('lb-next').disabled = comic.images.length <= 1;
        document.getElementById('lb-more-grid').innerHTML = comics
          .filter((_, i) => i !== index)
          .map(c => {
            const origIndex = comics.indexOf(c);
            return `<div class="lb-more-tile" onclick="openLightbox(${origIndex})">
              <img src="${c.cover}" alt="${c.title}" onerror="this.style.display='none'">
            </div>`;
          }).join('');
        document.getElementById('lb-more').style.display = comics.length > 1 ? '' : 'none';
      } else {
        document.getElementById('lb-prev').disabled = index === 0;
        document.getElementById('lb-next').disabled = index === comics.length - 1;
      }

      const lb = document.getElementById('lightbox');
      lb.classList.add('open');
      lb.scrollTop = 0;
      document.body.style.overflow = isMobile ? '' : 'hidden';

      document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
      document.querySelector(`.tile[data-index="${index}"]`)?.classList.add('active');
    }

    document.getElementById('lb-prev').addEventListener('click', () => {
      if (window.innerWidth <= 600) {
        if (mobilePanelIndex > 0) { mobilePanelIndex--; updateMobileCarousel(comics[activeIndex].images); }
      } else {
        if (activeIndex > 0) openLightbox(activeIndex - 1);
      }
    });

    document.getElementById('lb-next').addEventListener('click', () => {
      if (window.innerWidth <= 600) {
        const images = comics[activeIndex].images;
        if (mobilePanelIndex < images.length - 1) { mobilePanelIndex++; updateMobileCarousel(images); }
      } else {
        if (activeIndex < comics.length - 1) openLightbox(activeIndex + 1);
      }
    });

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
      document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
      activeIndex = null;
      mobilePanelIndex = 0;
    }

    document.getElementById('lb-close').addEventListener('click', closeLightbox);

    document.getElementById('lb-content').addEventListener('click', e => {
      if (window.innerWidth <= 600) return;
      if (e.target === document.getElementById('lb-content')) closeLightbox();
    });

    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (window.innerWidth > 600) {
        if (e.key === 'ArrowLeft' && activeIndex > 0) openLightbox(activeIndex - 1);
        if (e.key === 'ArrowRight' && activeIndex < comics.length - 1) openLightbox(activeIndex + 1);
      }
    });

    // simple swipe
    let touchStartX = 0;
    let touchStartY = 0;
    let didSwipe = false;

    document.getElementById('lb-images').addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      didSwipe = false;
    }, { passive: true });

    document.getElementById('lb-images').addEventListener('touchend', e => {
      if (window.innerWidth > 600) return;
      // ignore swipes starting within 30px of screen edge (iOS back gesture zone)
      if (touchStartX < 30) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) < Math.abs(dy) || Math.abs(dx) < 40) return;
      didSwipe = true;
      const images = comics[activeIndex].images;
      if (dx < 0 && mobilePanelIndex < images.length - 1) { mobilePanelIndex++; updateMobileCarousel(images); }
      else if (dx > 0 && mobilePanelIndex > 0) { mobilePanelIndex--; updateMobileCarousel(images); }
    });

    // prevent close when a swipe just happened
    document.getElementById('lightbox').addEventListener('click', e => {
      if (didSwipe) { didSwipe = false; return; }
    });

    window.addEventListener('resize', () => {
      if (activeIndex !== null) closeLightbox();
    });

    loadComics();
  </script>

</body>
</html>
